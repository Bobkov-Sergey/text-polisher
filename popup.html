<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Text Polisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      width: 360px; background: #fff; color: #202124;
      font-size: 14px; border-radius: 8px; overflow: hidden;
    }
    .panel { padding: 16px; position: relative; }
    .panel.source { background: #f8f9fa; border-bottom: 1px solid #e8eaed; }
    .panel.result { background: #fff; min-height: 120px; }
    textarea, .result-text {
      width: 100%; border: none; outline: none; resize: none;
      font-family: inherit; font-size: 16px; line-height: 1.5;
      background: transparent; color: inherit;
    }
    textarea { height: 100px; min-height: 60px; padding-right: 40px; }
    .result-text {
      white-space: pre-wrap; word-break: break-word;
      min-height: 80px; display: flex; align-items: center;
    }
    .actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; border-top: 1px solid #e8eaed;
    }
    .actions-left, .actions-right { display: flex; gap: 8px; align-items: center; }
    button {
      background: none; border: none; cursor: pointer;
      color: #5f6368; padding: 6px; border-radius: 50%;
      width: 36px; height: 36px; display: flex; align-items: center;
      justify-content: center; transition: background 0.2s;
    }
    button:hover { background: #e8eaed; }
    button svg { width: 20px; height: 20px; fill: currentColor; }
    button.primary {
      background: #1a73e8; color: white; border-radius: 24px;
      padding: 8px 24px; width: auto; height: 36px;
      font-weight: 500; font-size: 14px;
    }
    button.primary:hover { background: #1765cc; }
    .swap-btn { position: absolute; left: 16px; bottom: 12px; }
    .char-count { font-size: 12px; color: #5f6368; margin-right: 8px; }
    .divider { border-top: 1px solid #e8eaed; }
    hr { border: none; border-top: 1px solid #e8eaed; margin: 0; }
    .link { color: #1a73e8; cursor: pointer; text-decoration: none; font-size: 13px; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.2); border-top-color: #1a73e8;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { display: flex; align-items: center; color: #5f6368; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      .panel.source { background: #303134; border-color: #5f6368; }
      .panel.result { background: #202124; }
      .actions, .divider { border-color: #5f6368; }
      button { color: #e8eaed; }
      button:hover { background: #3c4043; }
      button.primary { background: #8ab4f8; color: #202124; }
      button.primary:hover { background: #aecbfa; }
      textarea, .result-text { color: #e8eaed; }
      .char-count { color: #9aa0a6; }
      .spinner { border-color: rgba(255,255,255,0.2); border-top-color: #8ab4f8; }
      .loading-text { color: #9aa0a6; }
    }
  </style>
</head>
<body>
  <div class="panel source">
    <textarea id="inputText" placeholder="Введите текст..."></textarea>
    <div class="swap-btn">
      <button id="clearInputBtn" title="Очистить">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>
  <div class="actions">
    <div class="actions-left">
      <button id="pasteFromClipboardBtn" title="Вставить из буфера">
        <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1S9.6 1.84 9.18 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v2h10V5h2v14z"/></svg>
      </button>
    </div>
    <button id="rephraseFromPopupBtn" class="primary">Перефразировать</button>
    <div class="actions-right">
      <span class="char-count" id="charCount">0 / 5000</span>
    </div>
  </div>
  <div class="panel result" id="resultPanel">
    <div class="result-text" id="resultContainer">Перефразированный текст появится здесь</div>
  </div>
  <div class="actions divider">
    <div class="actions-left">
      <button id="copyResultBtn" title="Копировать">
        <svg viewBox="0 0 24 24" id="copyIcon"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>
    <div class="actions-right">
      <a class="link" id="openSettings">Настройки</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

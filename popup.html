<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Text Polisher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      width: 240px;
      background: #f5f5f7;
      color: #1d1d1f;
      font-size: 14px;
      margin: 0;
    }
    .stat { margin-bottom: 12px; }
    .stat strong { display: block; color: #6e6e73; font-weight: 500; font-size: 12px; }
    .value { font-size: 18px; font-weight: 600; }
    hr { border: none; border-top: 1px solid #d2d2d7; margin: 12px 0; }
    .link { color: #007aff; cursor: pointer; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f5f5f7; }
      hr { border-color: #3a3a3c; }
      .stat strong { color: #98989d; }
      .link { color: #0a84ff; }
    }
  </style>
</head>
<body>
  <div class="stat">
    <strong>Сегодня</strong>
    <span class="value" id="dailyCount">0</span>
  </div>
  <div class="stat">
    <strong>Любимый провайдер</strong>
    <span id="favoriteProvider">—</span>
  </div>
  <div class="stat">
    <strong>Любимый стиль</strong>
    <span id="favoriteStyle">—</span>
  </div>
  <hr>
  <a class="link" id="openSettings">Открыть настройки</a>
  <script src="popup.js"></script>
</body>
</html>
